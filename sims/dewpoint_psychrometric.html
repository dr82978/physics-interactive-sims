<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業版：露點模擬與濕空氣線圖 (1 ATM)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f1e8;
            color: #26303b;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            align-items: center;
        }
        .container {
            background: #fffdf8;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(38,48,59,0.15);
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h2 { text-align: center; color: #0b6f9c; margin: 0 0 10px 0; letter-spacing: 1px; }
        
        /* 上半部：視覺化區域 */
        .top-section {
            display: flex;
            gap: 20px;
            height: 350px;
        }
        
        /* 左半部：水槽模擬器 */
        .visual-panel {
            flex: 1;
            background: #f6f2e8;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
            border: 1px solid #ddd5c4;
        }
        .panel-title {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 0.9rem;
            color: #566170;
            font-weight: bold;
        }
        .capacity-box {
            width: 120px;
            height: 250px; /* 基準高度 */
            border: 3px dashed #9a9080;
            border-bottom: 4px solid #7d8794;
            position: relative;
            transition: height 0.3s ease;
            display: flex;
            align-items: flex-end;
            border-radius: 4px 4px 0 0;
            background: rgba(255,255,255,0.02);
            margin-bottom: 20px;
        }
        .water-vapor {
            width: 100%;
            background: linear-gradient(to top, #0077cc, #33aaff);
            position: absolute;
            bottom: 0;
            transition: height 0.3s ease, bottom 0.3s ease;
            opacity: 0.7;
        }
        .condensed-water {
            width: 100%;
            background: linear-gradient(to top, #003366, #005599);
            position: absolute;
            bottom: 0;
            transition: height 0.3s ease;
            border-top: 2px solid #00aaff;
            z-index: 2;
        }
        
        /* 右半部：空氣線圖 */
        .chart-panel {
            flex: 2;
            background: #f6f2e8;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            border: 1px solid #ddd5c4;
            display: flex;
            flex-direction: column;
        }
        canvas {
            width: 100%;
            flex: 1;
            min-height: 0;
            margin-top: 22px;
            background: #fbf8f1;
            border-radius: 6px;
        }

        /* 下半部：控制與數據 */
        .bottom-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f6f2e8;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd5c4;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .data-box {
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #0b6f9c;
        }
        .data-label { font-size: 0.8rem; color: #566170; margin-bottom: 5px; }
        .data-value { font-size: 1.1rem; font-weight: bold; color: #26303b; }

        .controls {
            display: flex;
            gap: 20px;
        }
        .control-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label { font-weight: bold; font-size: 0.9rem; color: #26303b; }
        .input-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type=range] { flex: 1; cursor: pointer; accent-color: #0b6f9c; }
        input[type=number] {
            width: 80px;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #0b6f9c;
            background: #ffffff;
            color: #26303b;
            font-size: 1rem;
            text-align: center;
        }
        @media (max-width: 760px) {
            body { align-items: flex-start; }
            .top-section { flex-direction: column; height: auto; }
            .visual-panel { flex: none; height: 360px; }   /* 需要明確高度，容器框的百分比高度才有基準 */
            .chart-panel { flex: none; height: 300px; }
            .dashboard { grid-template-columns: 1fr 1fr; }
            .controls { flex-direction: column; }
        }
        button:focus-visible, input:focus-visible { outline: 2px solid #0b6f9c; outline-offset: 2px; }
        .alert-text {
            color: #c2412d;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>科學濕空氣線圖與露點模擬</h2>
    
    <div class="top-section">
        <div class="visual-panel">
            <div class="panel-title">容納量與凝結模擬</div>
            <div class="capacity-box" id="box-capacity">
                <div class="water-vapor" id="box-vapor"></div>
                <div class="condensed-water" id="box-liquid" style="height: 0%;"></div>
            </div>
            <div style="font-size: 0.75rem; color:#7d8794; text-align:center;">虛線框 = 最大容納量</div>
        </div>
        
        <div class="chart-panel">
            <div class="panel-title">濕空氣線圖 (Psychrometric Chart)</div>
            <canvas id="psychChart" role="img" aria-label="濕空氣線圖：橫軸溫度，縱軸水氣密度，藍線為飽和曲線"></canvas>
        </div>
    </div>

    <div class="bottom-section">
        <div class="dashboard">
            <div class="data-box">
                <div class="data-label">🌡️ 溫度 / 露點</div>
                <div class="data-value"><span id="val-temp">25.0</span> / <span id="val-dew" style="color:#0b6f9c;">15.0</span> °C</div>
            </div>
            <div class="data-box">
                <div class="data-label">💧 相對濕度 (RH)</div>
                <div class="data-value" id="val-rh">50 %</div>
            </div>
            <div class="data-box">
                <div class="data-label">⚖️ 空氣中水氣密度</div>
                <div class="data-value"><span id="val-ah">12.00</span> g/m³</div>
            </div>
            <div class="data-box" style="border-left-color: #c2412d;">
                <div class="data-label">🌧️ 凝結液態水</div>
                <div class="data-value"><span id="val-liquid">0.00</span> g/m³</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>調整溫度 (°C)</label>
                <div class="input-row">
                    <input type="range" id="slide-temp" min="-10" max="45" step="0.1" value="25">
                    <input type="number" id="input-temp" min="-10" max="45" step="0.1" value="25">
                </div>
            </div>
            <div class="control-group">
                <label>總水氣含量輸入 (g/m³)</label>
                <div class="input-row">
                    <input type="range" id="slide-ah" min="0.1" max="60" step="0.1" value="11.5">
                    <input type="number" id="input-ah" min="0.1" max="60" step="0.1" value="11.5">
                </div>
            </div>
        </div>
        <div class="alert-text" id="alert-msg"></div>
    </div>
</div>

<script>
    // --- 物理公式核心 ---
    const MW = 18.01528; 
    const MAX_AH_SCALE = 65; 

    function getSatVaporPressure(t) {
        return 6.1078 * Math.exp((17.27 * t) / (t + 237.3));
    }
    function pressureToDensity(p, t) {
        return (216.5 * p) / (t + 273.15);
    }
    function densityToPressure(d, t) {
        return (d * (t + 273.15)) / 216.5;
    }
    function calculateDewPoint(vp) {
        if (vp <= 0.01) return -273.15;
        const ln = Math.log(vp / 6.1078);
        return (237.3 * ln) / (17.27 - ln);
    }

    // --- DOM 元素 ---
    const domTempSlide = document.getElementById('slide-temp');
    const domTempInput = document.getElementById('input-temp');
    const domAhSlide = document.getElementById('slide-ah');
    const domAhInput = document.getElementById('input-ah');
    
    const valTemp = document.getElementById('val-temp');
    const valDew = document.getElementById('val-dew');
    const valRh = document.getElementById('val-rh');
    const valAh = document.getElementById('val-ah');
    const valLiquid = document.getElementById('val-liquid');
    const alertMsg = document.getElementById('alert-msg');

    const boxCapacity = document.getElementById('box-capacity');
    const boxVapor = document.getElementById('box-vapor');
    const boxLiquid = document.getElementById('box-liquid');
    
    const canvas = document.getElementById('psychChart');
    const ctx = canvas.getContext('2d');

    // 系統狀態變數
    let currentTemp = 25.0; 
    let vaporPressure = densityToPressure(11.5, 25.0); 

    // --- 繪製濕空氣線圖 (Canvas) ---
    let CW = 550, CH = 300, lastArgs = null;
    function fitCanvas() {                       // 依實際顯示尺寸與 devicePixelRatio 配置，避免拉伸模糊
        const r = canvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
        CW = Math.max(240, r.width); CH = Math.max(180, r.height);
        canvas.width = Math.round(CW * dpr); canvas.height = Math.round(CH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function drawChart(temp, airDensity, dewPoint) {
        lastArgs = [temp, airDensity, dewPoint];
        ctx.clearRect(0, 0, CW, CH);
        ctx.textBaseline = 'alphabetic';
        
        const padL = 45, padR = 20, padT = 20, padB = 30;
        const w = CW - padL - padR;
        const h = CH - padT - padB;
        
        // 座標轉換函數
        const minT = -10, maxT = 45;
        const minD = 0, maxD = 65;
        const getX = (t) => padL + ((t - minT) / (maxT - minT)) * w;
        const getY = (d) => padT + h - ((d - minD) / (maxD - minD)) * h;

        // 1. 繪製格線與座標軸
        ctx.strokeStyle = '#ddd5c4'; ctx.lineWidth = 1;
        ctx.fillStyle = '#7d8794'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        
        // X軸 (溫度)
        for(let t = -10; t <= 45; t += 10) {
            let x = getX(t);
            ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + h); ctx.stroke();
            ctx.fillText(t + '°C', x, padT + h + 15);
        }
        // Y軸 (絕對濕度)
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for(let d = 0; d <= 60; d += 10) {
            let y = getY(d);
            ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + w, y); ctx.stroke();
            ctx.fillText(d, padL - 5, y);
        }
        ctx.save();
        ctx.translate(15, padT + h/2);
        ctx.rotate(-Math.PI/2);
        ctx.fillStyle = '#566170';
        ctx.fillText("水氣密度 (g/m³)", 0, 0);
        ctx.restore();

        // 2. 繪製飽和曲線 (RH = 100%)
        ctx.strokeStyle = '#0b6f9c'; ctx.lineWidth = 2;
        ctx.beginPath();
        for(let t = minT; t <= maxT; t += 0.5) {
            let maxP = getSatVaporPressure(t);
            let maxDens = pressureToDensity(maxP, t);
            if(maxDens <= maxD) {
                let x = getX(t), y = getY(maxDens);
                if(t === minT) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
        }
        ctx.stroke();
        
        // 標示飽和曲線（標籤放在曲線左上方空白處，避免被曲線壓住）
        ctx.fillStyle = '#0b6f9c'; ctx.textAlign = 'right';
        ctx.fillText("100% 飽和線（露點線）", getX(26), getY(pressureToDensity(getSatVaporPressure(26), 26)) - 8);

        // 3. 標示當下狀態點
        let px = getX(temp);
        let py = getY(airDensity);
        
        // 畫等濕度水平線 (露點連線)
        if(dewPoint >= minT) {
            ctx.strokeStyle = '#c26d00'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(getX(dewPoint), py);
            ctx.lineTo(px, py);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 標示露點
            ctx.fillStyle = '#c26d00';
            ctx.beginPath(); ctx.arc(getX(dewPoint), py, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillText("露點 " + dewPoint.toFixed(1) + "°C", getX(dewPoint) - 10, py - 10);
        }

        // 畫等溫垂直線
        ctx.strokeStyle = '#7d8794'; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, padT+h); ctx.stroke();
        ctx.setLineDash([]);

        // 狀態點
        ctx.fillStyle = '#c2412d';
        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }

    // --- 核心更新邏輯 ---
    function updateSimulation(source) {
        currentTemp = parseFloat(domTempInput.value);
        if (currentTemp > 45) currentTemp = 45; if (currentTemp < -10) currentTemp = -10;

        if (source === 'ah') {
            let inputAh = parseFloat(domAhInput.value);
            vaporPressure = densityToPressure(inputAh, currentTemp);
        }

        const maxVaporPressure = getSatVaporPressure(currentTemp);
        const maxDensity = pressureToDensity(maxVaporPressure, currentTemp);
        let totalDensity = pressureToDensity(vaporPressure, currentTemp);

        if (source === 'temp' || source === 'init') {
            domAhSlide.value = totalDensity.toFixed(1);
            domAhInput.value = totalDensity.toFixed(1);
        }

        let rh = (vaporPressure / maxVaporPressure) * 100;
        let airDensity = totalDensity; 
        let liquidDensity = 0; 

        if (rh >= 100) {
            rh = 100;
            airDensity = maxDensity; // 空氣最多只能吃飽
            liquidDensity = totalDensity - maxDensity; // 多出來變液態
            alertMsg.innerHTML = "⚠️ 溫度低於露點！多餘水氣已被迫凝結出 " + liquidDensity.toFixed(2) + " g/m³ 的液態水";
        } else {
            alertMsg.innerHTML = "";
        }

        const dewPoint = calculateDewPoint(densityToPressure(airDensity, currentTemp));

        // 更新數據
        valTemp.textContent = currentTemp.toFixed(1);
        valDew.textContent = dewPoint.toFixed(1);
        valRh.textContent = rh.toFixed(1);
        valAh.textContent = airDensity.toFixed(2);
        valLiquid.textContent = liquidDensity.toFixed(2);

        // 更新水槽視覺
        const capacityPercent = (maxDensity / MAX_AH_SCALE) * 100;
        boxCapacity.style.height = `${capacityPercent}%`;
        
        if (liquidDensity > 0) {
            boxLiquid.style.height = `${(liquidDensity / totalDensity) * 100}%`;
            boxVapor.style.height = `${(maxDensity / totalDensity) * 100}%`;
            boxVapor.style.bottom = `${(liquidDensity / totalDensity) * 100}%`;
            boxCapacity.style.height = `${(totalDensity / MAX_AH_SCALE) * 100}%`; 
        } else {
            boxVapor.style.height = `${(airDensity / maxDensity) * 100}%`;
            boxLiquid.style.height = `0%`;
            boxVapor.style.bottom = `0%`;
        }

        // 更新圖表 (只畫出目前空氣中的水氣，凝結的水不算在空氣狀態內)
        drawChart(currentTemp, airDensity, dewPoint);
    }

    // 事件監聽
    domTempSlide.addEventListener('input', (e) => { domTempInput.value = e.target.value; updateSimulation('temp'); });
    domTempInput.addEventListener('input', (e) => { domTempSlide.value = e.target.value; updateSimulation('temp'); });
    domAhSlide.addEventListener('input', (e) => { domAhInput.value = e.target.value; updateSimulation('ah'); });
    domAhInput.addEventListener('input', (e) => { domAhSlide.value = e.target.value; updateSimulation('ah'); });

    window.addEventListener('resize', () => { fitCanvas(); if (lastArgs) drawChart(...lastArgs); });
    // 初始化
    fitCanvas();
    updateSimulation('init');
</script>

</body>
</html>
